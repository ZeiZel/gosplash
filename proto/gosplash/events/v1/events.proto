syntax = "proto3";

// Пакет обязан совпадать с путём к файлу: proto/gosplash/events/v1 →
// gosplash.events.v1. Так требует buf, и так же устроены все чужие
// протофайлы, которые ты встретишь.
//
// Префикс gosplash здесь не украшение. Имя protobuf-пакета глобально:
// оно попадает в реестр типов и в поле type_url у Any (см. Envelope ниже).
// Пакет с именем events.v1 занял бы слово events для всех, кто когда-либо
// слинкует наш код со своим, — и рано или поздно это кончилось бы конфликтом
// типов в рантайме.
package gosplash.events.v1;

import "google/protobuf/any.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Контракты Kafka-сообщений.
//
// Почему события описаны отдельно от gRPC-сервисов: у них разный жизненный
// цикл. gRPC-контракт меняется вместе с деплоем обеих сторон, а сообщение может
// лежать в топике неделю и быть прочитанным версией сервиса, которой в момент
// записи ещё не существовало. Отсюда правило: поля только добавляются, номера
// никогда не переиспользуются, удалённые уходят в reserved. Нарушение ловит
// `buf breaking` в CI.
//
// Почему protobuf, а не JSON: тот же контракт, что и у gRPC, тот же
// сгенерированный код, и невозможно случайно переименовать поле — в бинарном
// формате важен номер, а не имя.
// ─────────────────────────────────────────────────────────────────────────────

// Envelope — конверт, в котором едет ЛЮБОЕ событие проекта.
//
// В топик пишется всегда Envelope, а не payload напрямую. Четыре причины,
// каждая из которых по отдельности уже оправдывает лишний уровень вложенности:
//
//  1. Дедупликация. Kafka даёт at-least-once, то есть одно и то же сообщение
//     может приехать дважды. Консьюмер отсеивает повтор по event_id, и для
//     этого ему НЕ нужно уметь разбирать payload — достаточно конверта.
//
//  2. Несколько типов событий в одном топике. order.order.* несёт placed,
//     paid и completed. Без event_type консьюмеру пришлось бы угадывать тип
//     по успешности десериализации, а это не работает: protobuf почти всегда
//     успешно разбирает чужое сообщение, просто получается мусор.
//
//  3. Осмысленный DLQ. Когда payload битый, event_id и event_type — ровно то,
//     что нужно для разбора инцидента, и ровно то, чего без конверта нет.
//
//  4. Версионирование. schema_version позволяет обработать старую версию
//     события иначе, не ломая контракт и не заводя новый топик.
message Envelope {
  // UUID v7, а не v4: в нём первые 48 бит — это timestamp, поэтому значения
  // монотонно растут. Для первичного ключа в PostgreSQL (таблицы outbox и
  // processed_events) это важно: случайный UUID v4 вставляется в случайное
  // место B-tree, разносит записи по страницам и раздувает WAL.
  string event_id = 1;

  // Полное имя события в той же нотации, что и топик: "media.photo.uploaded".
  // Дублирует заголовок Kafka event_type намеренно — сообщение должно быть
  // самодостаточным и после того, как его переложили в DLQ или выгрузили в файл.
  string event_type = 2;

  // Идентификатор агрегата, с которым произошёл факт. Он же — КЛЮЧ сообщения
  // в Kafka, то есть именно он определяет партицию и, следовательно, порядок.
  // См. docs/adr/0009-* про выбор ключей.
  string aggregate_id = 3;

  // Момент, когда факт произошёл, — по часам продюсера. Не путать со временем
  // записи в Kafka (оно своё, у record'а): между ними может быть заметная
  // разница, если продюсер ретраил отправку или событие пролежало в outbox.
  int64 occurred_at_unix_ms = 4;

  // Версия схемы payload'а. Растёт, когда меняется СМЫСЛ полей, а не когда
  // просто добавили новое поле, — добавление обратно совместимо само по себе.
  int32 schema_version = 5;

  // Само событие. Any хранит полное имя типа строкой
  // ("type.googleapis.com/gosplash.events.v1.PhotoUploaded") и его
  // сериализованные байты — поэтому конверт не зависит от того, что внутри,
  // и не требует правки при добавлении нового типа события.
  //
  // Цена: лишние байты на имя типа и лишний шаг распаковки
  // (anypb.UnmarshalTo). Это и есть причина, по которой protobuf-пакетам
  // нужен namespace: имя типа внутри Any обязано быть глобально уникальным.
  google.protobuf.Any payload = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// Payload'ы. Метаданные (кто, когда, какой версии) в них не дублируются —
// они уже в конверте.
// ─────────────────────────────────────────────────────────────────────────────

// PhotoUploaded — «автор загрузил фото». Топик media.photo.uploaded,
// ключ сообщения — photo_id.
//
// Событие намеренно ТОНКОЕ: только идентификаторы, без title, размеров и
// прочих подробностей. Причины:
//
//   1. Подробности к моменту чтения могли устареть — консьюмер всё равно
//      должен сходить за актуальными данными (это и делает catalog по gRPC).
//   2. Толстые события превращают топик в базу данных и связывают сервисы
//      сильнее, чем прямой вызов: при каждом изменении модели пришлось бы
//      версионировать событие.
//
// Обратная сторона — один сетевой вызов на каждое событие. Когда это станет
// узким местом, событие «утолщают» осознанно, а не по умолчанию.
message PhotoUploaded {
  string photo_id = 1;

  // Ключ шардирования media. Без него получатель не сможет спросить media
  // о фото: таблица photos разрезана по user_id, и сервис не знает, на какой
  // из баз искать строку. Это самое наглядное следствие шардирования —
  // оно протекает в контракт (см. docs/adr/0002-*).
  int64 user_id = 2;
}

// PhotoThumbnailReady — «превью готовы, фото можно показывать».
// Топик media.photo.thumbnail-ready, ключ — photo_id.
message PhotoThumbnailReady {
  string photo_id = 1;
  int64 user_id = 2;

  // Ключи готовых превью в S3. Здесь событие сознательно чуть толще тонкого:
  // потребителю (catalog) нужны именно эти ключи, и без них он всё равно
  // сходил бы за ними по gRPC немедленно и всегда.
  repeated Thumbnail thumbnails = 3;
}

message Thumbnail {
  // small | medium | large
  string size = 1;
  string storage_key = 2;
  int32 width = 3;
  int32 height = 4;
}

// PhotoDeleted — «фото удалено». Топик media.photo.deleted, ключ — photo_id.
message PhotoDeleted {
  string photo_id = 1;
  int64 user_id = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// События каталога, заказов, кошелька и аналитики.
// ─────────────────────────────────────────────────────────────────────────────

// ListingPublished — «карточка появилась или изменилась».
// Топик catalog.listing.published, ключ — listing_id. Слушает search.
//
// Здесь событие намеренно ТОЛСТОЕ, в отличие от media.photo.uploaded.
// Причина: потребитель (поисковый индекс) всё равно кладёт к себе копию
// всех этих полей, и тонкое событие означало бы обязательный поход в catalog
// на каждое изменение. Правило «события тонкие» — не догма, а умолчание;
// толстое событие выбирают, когда потребителю нужна ровно вся полезная
// нагрузка и всегда.
message ListingPublished {
  string listing_id = 1;
  int64 author_id = 2;
  string author_name = 3;
  string title = 4;
  repeated string tags = 5;
  int64 price_cents = 6;
  string currency = 7;
  string status = 8;
}

// PhotoViewed — «карточку посмотрели». Топик analytics.photo.viewed,
// ключ — photo_id, чтобы агрегации в ClickHouse шли по фото.
//
// Событий этого типа на порядки больше, чем всех остальных вместе, поэтому
// оно максимально плоское и без вложенных сообщений: каждое лишнее поле
// умножается на миллионы.
message PhotoViewed {
  string photo_id = 1;
  int64 author_id = 2;
  // Ноль — аноним. Optional-семантика через ноль, а не wrapper-тип:
  // экономия байт на самом частом событии того стоит.
  int64 viewer_id = 3;
  string country = 4;
}

// OrderPlaced — «заказ принят, сага началась». Топик order.order.placed.
message OrderPlaced {
  string order_id = 1;
  int64 buyer_id = 2;
  string listing_id = 3;
  int64 price_cents = 4;
  string currency = 5;
}

// OrderPaid — «заказ оплачен, лицензия выдана». Топик order.order.paid.
message OrderPaid {
  string order_id = 1;
  int64 buyer_id = 2;
  int64 author_id = 3;
  string listing_id = 4;
  string license_id = 5;
  int64 price_cents = 6;
  string currency = 7;
}

// AccountDebited — «со счёта списано». Топик wallet.account.debited,
// ключ — account_id: порядок операций по одному счёту обязан сохраняться.
message AccountDebited {
  int64 account_id = 1;
  int64 amount_cents = 2;
  string currency = 3;
  // Что это было: "order_payment" | "payout" | "refund".
  string reason = 4;
  string reference_id = 5;
}

syntax = "proto3";

package gosplash.order.v1;

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────────────────────────
// OrderService — покупка лицензии.
//
// Сервис не делает работу сам: он принимает заказ и запускает сагу
// PlaceOrderWorkflow в Temporal. Состояние заказа хранится дважды —
// в собственной таблице (чтобы отвечать на GetOrder быстро) и в истории
// воркфлоу (чтобы сага пережила падение процесса). Это не дублирование
// ради дублирования: у двух хранилищ разные задачи.
// ─────────────────────────────────────────────────────────────────────────────
service OrderService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message PlaceOrderRequest {
  int64 buyer_id = 1;
  string listing_id = 2;

  // Ключ идемпотентности приходит ОТ КЛИЕНТА, в отличие от wallet, где им
  // служит order_id. Причина: заказа ещё нет, а повтор возможен уже здесь —
  // пользователь нажал «купить» дважды, мобильный клиент переотправил запрос
  // после таймаута. Без ключа это два заказа и два списания.
  //
  // Повтор с тем же ключом возвращает тот же заказ; параллельный повтор,
  // пока первый ещё выполняется, получает 409 Conflict.
  string idempotency_key = 3;
}

message PlaceOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message Order {
  string id = 1;
  int64 buyer_id = 2;
  string listing_id = 3;

  int64 price_cents = 4;
  string currency = 5;

  // pending → funds_reserved → license_granted → completed
  //         ↘ compensating → failed
  //
  // Состояние в прошедшем времени описывает, что УЖЕ удалось, а не что
  // происходит: во время ретрая шага заказ остаётся в предыдущем состоянии,
  // и это честнее, чем «в процессе».
  string status = 6;

  // Почему не получилось. Пусто у успешных заказов.
  string failure_reason = 7;

  // Идентификатор лицензии, если она выдана.
  string license_id = 8;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

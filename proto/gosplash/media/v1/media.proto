syntax = "proto3";

// Пакет обязан совпадать с путём к файлу: proto/gosplash/media/v1 →
// gosplash.media.v1. Про префикс gosplash см. комментарий в events.proto.
package gosplash.media.v1;

// ─────────────────────────────────────────────────────────────────────────────
// MediaService — синхронный API media-сервиса.
//
// gRPC здесь потому, что вызывающему нужен ответ ПРЯМО СЕЙЧАС: catalog получил
// из Kafka факт «фото загружено» и идёт за подробностями. Через Kafka такое
// делать нельзя — это был бы request-reply через очередь, а это боль.
//
// Правило проекта: gRPC — вопрос или команда с ответом, Kafka — факт без ответа.
// ─────────────────────────────────────────────────────────────────────────────
service MediaService {
  // Карточка одного фото. user_id в запросе не случайно: таблица photos
  // шардирована по user_id, и без него сервис не знает, на какой из баз
  // искать. Это первое, что меняется в API после шардирования, — ключ
  // шардирования приходится тащить во все запросы.
  rpc GetPhoto(GetPhotoRequest) returns (GetPhotoResponse);
}

message GetPhotoRequest {
  string id = 1;
  int64 user_id = 2;
}

message GetPhotoResponse {
  Photo photo = 1;
}

// Photo — то, как media отдаёт фото наружу.
//
// Это НЕ строка таблицы: служебные поля и внутренние ключи наружу не уезжают.
// Контракт живёт своей жизнью и меняется медленнее схемы.
message Photo {
  string id = 1;
  int64 user_id = 2;
  string title = 3;
  // Ключ объекта в S3: originals/{user_id}/{id}.{ext}. Сами байты через gRPC
  // не передаются никогда — за файлом клиент идёт в MinIO по presigned-ссылке.
  string storage_key = 4;
  string mime = 5;
  int64 size_bytes = 6;
  // uploaded → processing → ready.
  string status = 7;
  // Номер шарда, на котором лежит строка. В настоящем API этого поля не было
  // бы — клиенту всё равно. Здесь оно есть, чтобы шардирование было видно
  // глазами в ответе curl.
  int32 shard = 8;
  int32 width = 9;
  int32 height = 10;
}

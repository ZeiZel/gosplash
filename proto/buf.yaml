# Конфигурация buf — это «go.mod для протобафа»: где лежат исходники,
# по каким правилам их линтить и как проверять обратную совместимость.
#
# Файл лежит рядом с контрактами, а не в корне репозитория: proto/ — это
# самостоятельный модуль контрактов, и его при желании можно опубликовать
# в реестр или подключить из другого репозитория, не таща с собой Go-код.
# Поэтому все buf-команды выполняются ИЗ этой директории (см. Makefile).
version: v2

modules:
  - path: .

lint:
  use:
    - STANDARD
  # Требование buf: имя пакета должно совпадать с путём к файлу.
  # У нас proto/gosplash/media/v1/media.proto → package gosplash.media.v1.
  # Префикс gosplash обязателен: имя protobuf-пакета глобально и попадает
  # в type_url у Any — см. комментарий в events.proto.

breaking:
  use:
    - FILE
  # `make proto-breaking` сравнит текущие контракты с последним коммитом
  # и не даст молча сломать поле, которое кто-то уже читает из топика.
  # Сравнение идёт с ../.git, потому что команда запускается из proto/,
  # а git-репозиторий на уровень выше.

# Конфигурация golangci-lint v2 (Makefile:tools ставит именно v2 —
# github.com/golangci/golangci-lint/v2).
#
# Цель этого файла — ловить ОШИБКИ (утечки, гонки, необработанные err,
# сравнение через == там, где нужен errors.Is), а не переписывать
# существующий стиль проекта. Поэтому набор линтеров сознательно уже
# того, что предлагает golangci-lint "из коробки": стилистические линтеры
# вроде gofumpt/lll/wsl/nlreturn или линтеры "нулевой толерантности"
# (godox, exhaustruct, ireturn) на учебном репозитории с уже написанным
# кодом дадут тысячи замечаний на стиль и утопят реальные находки — а
# смысл фазы 6 в обратном: непрерывная интеграция должна укреплять
# уверенность в коде, а не бесконечно откладывать мердж из-за форматирования.
#
# Список источника правды по каждому линтеру — комментарий рядом с ним.
version: "2"

run:
  # 5 минут с запасом: одиннадцать модулей, самый большой из них — media
  # с шардированием и rate-limiter'ом. В CI (см. .github/workflows/ci.yml)
  # golangci-lint запускается по каждому модулю отдельно (матрица), так что
  # это таймаут на ОДИН модуль, не на весь монорепозиторий разом.
  timeout: 5m

linters:
  # default: none — явный список включённых линтеров, а не "все minus
  # исключения". С default: none новый линтер, который golangci-lint
  # включит по умолчанию в будущей версии, не появится в CI без осознанного
  # решения добавить его сюда.
  default: none
  enable:
    # ─── Ошибки, которые ловятся статически ────────────────────────────
    - errcheck # необработанная ошибка — почти всегда баг, а не стиль
    - govet # набор проверок из `go vet`: printf, копирование мьютексов и т.п.
    - staticcheck # ошибки логики (SA-класс) + часть простых упрощений (S-класс)
    - ineffassign # присвоение, которое никогда не читается, — почти всегда недосмотр
    - unused # неиспользуемый код — на учебном репозитории особенно легко
    # оставить мёртвую функцию после рефакторинга и не заметить

    # ─── Специфичные для стека проекта ──────────────────────────────────
    - bodyclose # http.Response.Body, который никто не закрыл, — течёт
    - contextcheck # ctx передан НЕ из вызывающей функции — обрыв трейса/дедлайна,
    # который STYLE.md прямо называет причиной требования "всегда с контекстом"
    - errorlint # errors.Is/As вместо == и type assertion — ровно то, что
    # требует STYLE.md для доменных ошибок
    - copyloopvar # копирование переменной цикла в горутину/замыкание —
    # в pkg/kafkax партиции обрабатываются отдельными горутинами (engine.go),
    # это ровно то место, где старая ловушка `for _, v := range` стреляет
    - gosec # SQL-инъекции, слабая криптография, permissions — тяжёлые находки,
    # которые проект прямо просит проверять (см. docs/STYLE.md)

    # ─── Стиль, но с прямой пользой, а не вкусовщина ────────────────────
    - misspell # опечатки в английских словах (в т.ч. в идентификаторах и
    # строках логов/ошибок) — дёшево ловится, дорого стоит в проде
    - revive # быстрая замена golint: экспортированный идентификатор без
    # комментария, пустой блок и т.п. — настроен ниже узким набором правил,
    # а не "всё подряд" (default-конфиг revive почти так же шумен, как gofumpt)
    - gocritic # диагностики багов и производительности (диагностические
    # теги ниже — только opinionated и performance, не style — см. settings)

  settings:
    errcheck:
      # defer resp.Body.Close() / rows.Close() после того как тело/строки уже
      # прочитаны, а код ошибки закрытия ни на что не влияет, — в проекте
      # с десятками HTTP- и Kafka-адаптеров помечать каждый такой defer
      # `//nolint` дороже, чем сама проверка для этих двух конкретных методов.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close

    revive:
      # По умолчанию revive включает ~10 правил, часть из которых —
      # чистый стиль (var-naming, indent-error-flow). Явный список — только
      # то, что бывает багом, а не оформлением:
      rules:
        - name: context-as-argument # ctx не первым параметром — сюрприз для
          # вызывающего и нарушение конвенции, на которой держится весь
          # log/slog + otel в проекте (см. STYLE.md "Логи")
        - name: error-return # error должен быть последним возвращаемым
          # значением — иначе `if err != nil` на вызове легко перепутать местами
        - name: errorf # fmt.Errorf без %w там, где оборачивается ошибка —
          # ровно то, что STYLE.md требует явно ("Ошибки: оборачиваются с контекстом")
        - name: unreachable-code
        - name: duplicated-imports

    gosec:
      excludes:
        # G104 (unchecked error) выключен: этим уже занимается errcheck,
        # и две разных формулировки одной и той же находки только шумят.
        - G104
        # G115 (integer overflow при конверсии) в этом репозитории ловит
        # исключительно ЗАВЕДОМО ограниченные преобразования: остаток от
        # деления на количество шардов (pkg/dbx.ShardIndex — делитель
        # маленький, результат по определению меньше shardCount) и сдвиг
        # бита в экспоненциальном backoff (pkg/kafkax/backoff.go — степень
        # ограничена MaxRetryAttempts). G115 не умеет учитывать такие
        # границы значений и в коде с хешированием/битовой арифметикой
        # массово ложноположителен — ровно тот случай линтера, который
        # "завалит существующий код тысячей замечаний", если оставить
        # включённым.
        - G115
        # G404 (math/rand вместо crypto/rand) ловит три места, и все три —
        # джиттер (задержка повтора, TTL кэша), а не что-то, требующее
        # криптостойкой случайности: предсказуемость джиттера не помогает
        # атакующему и не роняет корректность, а crypto/rand.Int63 в цикле
        # backoff — это боль без пользы. Каноническая ложная находка G404,
        # рекомендация ей не следовать явно есть и в issue-трекере gosec.
        - G404
      config:
        # G302/G306 (права на файлы) по умолчанию требуют 0600/0644 —
        # слишком строго для .env и демо-скриптов, где это не секрет,
        # а конфиг для docker compose на локальной машине.
        G302: "0644"
        G306: "0644"

    gocritic:
      # Три группы диагностик gocritic: diagnostic (потенциальные баги),
      # performance (лишние аллокации/копирования) и style (авторские
      # предпочтения вроде "используй switch вместо if-else"). Включены
      # только первые две — style у gocritic самый спорный и самый шумный
      # раздел, и он не про ошибки.
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # ifElseChain (diagnostic) требует switch вместо цепочки if-else —
        # это стилистическое предпочтение, а не диагностика бага, и в
        # обработчиках ошибок kafkax (Retryable/Permanent, классификация по
        # типу) цепочка if читается яснее, чем switch без выражения.
        - ifElseChain
        # hugeParam и rangeValCopy (performance) советуют передавать
        # структуры-конфиги по указателю и не копировать значения в range —
        # микрооптимизация без единого замера, которая прямо противоречит
        # идиоме проекта: Config-структуры (otelx.Config, outbox.Config,
        # httpx.ServerConfig...) везде передаются ПО ЗНАЧЕНИЮ намеренно —
        # это неизменяемое значение, а не объект с идентичностью, и лишняя
        # косвенность через указатель усложнила бы чтение ради экономии
        # микросекунд там, где эти функции вызываются один раз при старте
        # процесса, а не в горячем пути. Включённым этот чек размножился бы
        # на десятки находок по всем Config-структурам всех сервисов —
        # ровно тот шум по стилю, которого просит избегать задача.
        - hugeParam
        - rangeValCopy

  exclusions:
    # Общие механизмы подавления (nolint-комментарии) не трогаем — правила
    # ниже точечные, по линтеру и по пути, с объяснением каждого.
    rules:
      # Тестам прощается то, что было бы утечкой или багом в проде:
      #   - gosec: тестовые данные, временные файлы 0644, http.Get на
      #     тестовый сервер httptest — это шум, а не находка;
      #   - bodyclose: в table-driven тестах http-клиентов тело ответа
      #     сплошь и рядом читается через io.ReadAll и не закрывается явно
      #     в каждом under-test случае — заводить defer на каждый под-тест
      #     ради линтера дороже, чем стоит эта проверка в тестах;
      #   - errcheck: в тестах он и так настроен мягче ниже (exclude-functions),
      #     но explicit-путь через path гарантирует то же для helper'ов теста,
      #     которые вызываются не как top-level Test-функции.
      - path: _test\.go
        linters:
          - gosec
          - bodyclose
          - errcheck

      # tools/** — однократно запускаемые руками админ-утилиты (docs/STYLE.md:
      # "Единственное исключение — утилиты в tools/"), а не сервисы с SLA.
      # gosec там в основном ловит "не проверен код возврата os.Remove"
      # и подобное в одноразовых скриптах реорганизации данных — цена
      # ложного вмешательства выше цены пропуска.
      - path: ^tools/
        linters:
          - gosec

      # contextcheck отмечает четыре места, где новый контекст СОЗНАТЕЛЬНО
      # не наследуется от текущего вызова — в каждом уже есть комментарий
      # в самом коде, почему. Разбор по одному, а не общее отключение
      # линтера: остальной код продолжает проверяться им как обычно.
      - path: pkg/grpcx/client_interceptors.go
        linters: [contextcheck]
        text: "Execute->recordBreakerRequest"
        # sony/gobreaker.Execute принимает func() error без параметров —
        # ctx передаётся замыканием, другого способа библиотека не даёт.
      - path: pkg/httpx/middleware.go
        linters: [contextcheck]
        text: "Recover"
        # анонимная функция в defer — замыкание над r.Context(), а не
        # отдельная функция, которой нужен параметр ctx.
      - path: pkg/kafkax/engine.go
        linters: [contextcheck]
        source: "newPartitionWorker\\(e\\.ctx, e\\.process\\)"
        # e.ctx — контекст на весь жизненный цикл consumer group, а не
        # одного вызова; партиция переживает много Poll'ов, и наследовать
        # ctx от текущего вызова assigned() было бы неверно (тот же принцип,
        # что и у detachedTimeout в этом пакете — отвязанный контекст для
        # долгоживущей операции).
      - path: pkg/redisx/lock.go
        linters: [contextcheck]
        source: "extend\\.Run\\(extendCtx"
        # extendCtx — намеренно НЕ ctx вызывающего (см. комментарий в коде
        # рядом): watchdog обязан успеть продлить лок, даже если родительский
        # ctx уже отменяется.
      - path: pkg/redisx/lock.go
        linters: [gosec]
        text: "G118"
        # То же самое решение (context.Background() в runWatchdog вместо
        # родительского ctx), что и выше в contextcheck: gosec приписывает
        # находку строке `go l.runWatchdog(ctx)`, хотя туда как раз передан
        # правильный ctx — сам Background() двумя уровнями глубже, внутри
        # runWatchdog, и уже разобран и оправдан комментарием там.

      # G108 (pprof на DefaultServeMux) — реальный совет gosec: не выставлять
      # pprof наружу. Проект это уже делает: pprof поднят на ОТДЕЛЬНОМ
      # служебном порту (см. ServeMetricsAndPprof чуть ниже по файлу и
      # комментарий там же "не должны быть доступны снаружи"), который в
      # docker-compose/деплое не публикуется наружу. gosec не видит топологию
      # сети и не может отличить это от реальной ошибки, поэтому — точечное
      # исключение, а не сомнение в самом правиле.
      - path: pkg/httpx/server.go
        linters: [gosec]
        text: "G108"

      # context-as-argument (revive) требует ctx первым параметром — общее
      # и полезное правило (см. rules выше), но эти два обработчика в тесте
      # ОБЯЗАНЫ повторять сигнатуру grpc.MethodDesc.Handler
      # (func(srv any, ctx context.Context, dec func(any) error,
      # interceptor grpc.UnaryServerInterceptor) (any, error)) — её задаёт
      # grpc-go, порядок параметров здесь не в власти автора файла.
      - path: pkg/grpcx/testservice_test.go
        linters: [revive]
        text: "context-as-argument"

      # errcheck на `defer xxxConn.Close()` в cmd/<сервис>/main.go —
      # композиции зависимостей (STYLE.md: "cmd/<сервис>/ — композиция
      # зависимостей, только здесь"). Соединение закрывается ПОСЛЕ того,
      # как процесс уже принял решение остановиться (defer перед
      # os.Exit/возвратом из main) — узнать об ошибке закрытия здесь
      # решительно некому и незачем, а `(io.Closer).Close` в exclude-functions
      # errcheck выше НЕ ловит эти вызовы: получатель — конкретный тип
      # (*redis.Client, *grpc.ClientConn, *sql.DB-подобные клиенты), а не
      # статически типизированное значение интерфейса io.Closer, и правило
      # exclude-functions матчится по статическому типу выражения, а не по
      # факту реализации интерфейса. Точечный text-фильтр — только на
      # сообщение "Close is not checked", остальной errcheck в cmd/
      # продолжает работать как обычно (например, поймает нечто важнее,
      # чем закрытие соединения на выходе).
      - path: cmd/
        linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"

formatters:
  # gofmt отдельно проверяется в CI шагом `gofmt -l` (см. .github/workflows/ci.yml)
  # именно потому, что это ожидаемая, а не опциональная часть пайплайна —
  # дублировать его здесь как ещё один линтер excessive: два места вывода
  # одной и той же находки только путают, где смотреть.
  enable: []

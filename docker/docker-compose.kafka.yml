# ─────────────────────────────────────────────────────────────────────────────
# Kafka для проекта Photostock.
#
# Здесь три контейнера:
#   kafka       — сам брокер. Единственный, кто реально нужен для работы.
#   kafka-init  — вспомогательный: один раз создаёт топики и завершается.
#   kafka-ui    — веб-интерфейс, чтобы глазами смотреть, что лежит в топиках.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ───────────────────────────────────────────────────────────────────────────
  # KAFKA — брокер сообщений.
  #
  # Именно к нему подключаются media-service (продюсер), thumbnail-worker
  # и catalog (консьюмеры). Он хранит топики и их партиции на диске.
  #
  # Режим KRaft: раньше Kafka требовала отдельный ZooKeeper для хранения
  # метаданных (кто лидер партиции, какие топики есть). Начиная с Kafka 3.x
  # брокер умеет хранить метаданные сам — это и есть KRaft. ZooKeeper
  # больше не нужен, поэтому контейнер всего один.
  # ───────────────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9094:9094"   # наружу открываем только порт для подключения с хоста

    environment:
      # --- Роли узла -----------------------------------------------------
      # В KRaft узел может быть broker (хранит данные и обслуживает клиентов),
      # controller (управляет метаданными кластера) или обоими сразу.
      # Для локальной разработки один узел делает и то и другое.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Список контроллеров, голосующих за лидера. У нас один: узел 1 на порту 9093.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listener'ы (на каких адресах брокер слушает) -----------------
      # Это самая частая причина ошибок «connection refused» у новичков.
      #
      # Брокер слушает на трёх портах:
      #   9092 INTERNAL   — для сервисов ВНУТРИ docker-сети (media, worker…)
      #   9093 CONTROLLER — служебный, для KRaft-контроллера
      #   9094 EXTERNAL   — для клиентов С ХОСТА (go run, kcat, DBeaver…)
      #
      # KAFKA_LISTENERS      — где реально слушать.
      # KAFKA_ADVERTISED_LISTENERS — какой адрес брокер СООБЩАЕТ клиенту.
      #   Клиент сначала подключается к bootstrap-адресу, а потом брокер
      #   говорит: «на самом деле ходи ко мне вот сюда». Если сказать
      #   контейнеру «localhost», а хосту «kafka» — ничего не заработает.
      #   Поэтому: внутри сети advertise = kafka:9092, снаружи = localhost:9094.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      # Все три без шифрования — это локальная разработка.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # По какому listener'у брокеры общаются между собой (у нас он один).
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Настройки под один брокер ------------------------------------
      # Kafka по умолчанию хочет реплицировать служебные топики на 3 брокера.
      # У нас брокер один, поэтому фактор репликации = 1, иначе не стартует.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1          # топик с offset'ами consumer group
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1  # топик состояния транзакций
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Задержка перед первой ребалансировкой группы. В проде 3 сек, чтобы
      # дождаться всех консьюмеров; локально ждать нечего.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Топики ---------------------------------------------------------
      # Запрещаем создавать топик автоматически при первом обращении.
      # Иначе опечатка в имени в коде молча создаст новый пустой топик,
      # и ты будешь час искать, почему worker ничего не получает.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Где хранить данные внутри контейнера (сюда монтируем volume).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Уникальный id кластера. В KRaft обязателен; любая строка в base64-подобном формате.
      CLUSTER_ID: photostock-kraft-cluster-0001

    volumes:
      # Сообщения переживут перезапуск контейнера.
      - kafka-data:/var/lib/kafka/data

    # Compose будет считать брокер «готовым», только когда он отвечает на
    # запрос версий API. От этого зависят kafka-init и kafka-ui (см. depends_on).
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10


  # ───────────────────────────────────────────────────────────────────────────
  # KAFKA-INIT — разовая «миграция» для Kafka.
  #
  # Тот же образ, что и брокер (в нём есть CLI-утилиты), но вместо запуска
  # брокера выполняет скрипт: ждёт, пока kafka станет healthy, создаёт
  # топики проекта и завершается. При повторном `docker compose up`
  # флаг --if-not-exists не даст ему упасть на уже существующих топиках.
  #
  # Зачем отдельный контейнер: авто-создание выключено (см. выше), а держать
  # список топиков в одном месте удобнее, чем создавать их из Go-кода.
  # ───────────────────────────────────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy   # стартует только после healthcheck брокера
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      set -e
      BS=kafka:9092
      # create <имя топика> <кол-во партиций>
      # Партиции = максимальный параллелизм консьюмеров в одной группе:
      # 6 партиций → до 6 worker'ов будут работать одновременно.
      create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists --topic $$1 --partitions $$2 --replication-factor 1; }

      # media → thumbnail-worker. Основной поток: «фото загружено, сделай превью».
      create image.uploaded         6
      # Сюда worker перекладывает сообщение, если обработка упала (например,
      # MinIO временно недоступен). Отдельный консьюмер читает его с задержкой.
      create image.uploaded.retry   6
      # Dead Letter Queue: сообщения, которые не удалось обработать после N
      # попыток (битый файл). Никто не читает автоматически — смотрим руками.
      create image.uploaded.dlq     1
      # thumbnail-worker → catalog. «Превью готовы, фото можно показывать».
      # Catalog по нему обновляет каталог и инвалидирует кэш в Redis.
      create image.processed        6
      # order → catalog / worker. Сага удаления: убрать из каталога, стереть файлы.
      create image.deleted          3
      # order → всем желающим. Факт покупки: нотификации, аналитика.
      create license.purchased      3

      echo 'Topics:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --list
      "


  # ───────────────────────────────────────────────────────────────────────────
  # KAFKA-UI — веб-интерфейс (http://localhost:8090).
  #
  # Не участвует в работе приложения, чисто для отладки: посмотреть список
  # топиков, прочитать конкретные сообщения, увидеть lag consumer group
  # (сколько сообщений worker ещё не обработал), проверить, в какие
  # партиции попали сообщения с одним ключом.
  #
  # kafbat/kafka-ui — поддерживаемый форк бывшего provectuslabs/kafka-ui.
  # ───────────────────────────────────────────────────────────────────────────
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"   # внутри контейнера UI на 8080, наружу отдаём 8090
    environment:
      KAFKA_CLUSTERS_0_NAME: photostock
      # UI живёт в той же docker-сети, поэтому ходит по INTERNAL-адресу.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Разрешает менять настройки кластера прямо из интерфейса.
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy


volumes:
  kafka-data:   # именованный volume для данных брокера

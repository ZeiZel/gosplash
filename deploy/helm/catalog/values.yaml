# ─────────────────────────────────────────────────────────────────────────────
# catalog-service — значения по умолчанию рассчитаны на deploy/kind, НЕ на
# прод (см. итоговый список в конце файла). Общий разбор решений (probes,
# terminationGracePeriodSeconds, preStop, resources, ConfigMap/Secret) —
# в deploy/helm/media/values.yaml, здесь только то, что у catalog иначе.
# ─────────────────────────────────────────────────────────────────────────────

image:
  repository: gosplash/catalog
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

ports:
  http: 8102
  grpc: 9102
  metrics: 8202

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ── ИНАЧЕ, ЧЕМ У MEDIA: 65с недостаточно ────────────────────────────────────
# У catalog ДВА Kafka-консьюмера (photo.uploaded, photo.thumbnail-ready) плюс
# их retry-версии и outbox-relay. При остановке (см. cmd/catalog/main.go)
# httpx.Shutdown(15s) + grpcx.Shutdown(15s) выполняются последовательно, а
# затем waitAll(15s, consumerDone, thumbnailDone) — это ОБЩИЙ бюджет 15с на
# ОБА канала сразу (не по 15с на каждый — see waitAll: один общий deadline),
# так что итог тот же порядок, что и у media: 2+15+15+15+5=52с worst-case.
# preStop добавляет ещё 5с сверху — берём 65с с тем же запасом, что и media.
terminationGracePeriodSeconds: 65

preStop:
  enabled: true
  sleepSeconds: 5

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    memory: 384Mi

# HPA по CPU. Строго говоря, catalog — ЧАСТИЧНО консьюмер (два Kafka-топика
# на индексацию), и для консьюмерной половины нагрузки правильная метрика —
# лаг партиций (consumer_group_lag), а не CPU: индексация может отставать
# из-за медленного Postgres/Redis при низком CPU, и HPA по CPU этого просто
# не увидит — под будет числиться "не перегружен" и не заскейлится ровно
# тогда, когда лаг растёт быстрее всего. Здесь всё равно оставлен CPU,
# потому что у catalog ЕСТЬ и вторая, читающая половина (публичный HTTP/gRPC
# витрины), для которой CPU — адекватная метрика, а KEDA/custom-metrics
# adapter для лага — отдельная инфраструктура вне объёма фазы 6 (см.
# docs/PLAN.md, alert rules по lag > 1000 уже заведены как алерт, а не как
# триггер автоскейла).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

service:
  http:
    type: ClusterIP

metrics:
  scrape: true
  path: /metrics

config:
  CATALOG_HTTP_ADDR: ":8102"
  CATALOG_GRPC_ADDR: ":9102"
  CATALOG_METRICS_ADDR: ":8202"
  CACHE_TTL: "10m"
  CATALOG_VIEW_BATCH_SIZE: "200"
  CATALOG_VIEW_FLUSH_INTERVAL: "2s"

  # media-grpc — headless Service чарта media (см. deploy/helm/media), тот
  # же namespace. Это тот САМЫЙ адрес, который резолвится в A-записи всех
  # подов media и балансируется round_robin (docs/adr/0015).
  MEDIA_GRPC_TARGET: "media-grpc:9101"

  KAFKA_BROKERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP_CATALOG: "catalog"
  KAFKA_CONSUMER_GROUP_THUMBNAIL: "thumbnail-worker"

  OUTBOX_POLL_INTERVAL: "1s"
  OUTBOX_BATCH_SIZE: "100"
  CONSUMER_MAX_RETRIES: "3"
  RETRY_DELAY: "30s"

  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "20"
  REDIS_MAX_RETRIES: "3"
  REDIS_DIAL_TIMEOUT: "2s"
  REDIS_READ_TIMEOUT: "500ms"

  GRPC_DEFAULT_TIMEOUT: "5s"

  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  ENVIRONMENT: "kind"
  LOG_LEVEL: "info"

secrets:
  # pg-catalog / pg-catalog-replica — Service'ы из deploy/kind/infra/postgres.yaml.
  CATALOG_DSN: "host=pg-catalog port=5432 user=gosplash password=gosplash dbname=gosplash sslmode=disable"
  CATALOG_REPLICA_DSN: "host=pg-catalog-replica port=5432 user=gosplash password=gosplash dbname=gosplash sslmode=disable"
  JWT_SECRET: ""
  REDIS_PASSWORD: ""

# ─────────────────────────────────────────────────────────────────────────────
# ЧТО ОБЯЗАНО ПОМЕНЯТЬСЯ ДЛЯ ПРОДА — см. deploy/helm/media/values.yaml,
# тот же список (image.tag/pullPolicy, secrets.* через внешний секрет-
# менеджер, JWT_SECRET, resources по факту нагрузки, PodDisruptionBudget).
# ─────────────────────────────────────────────────────────────────────────────

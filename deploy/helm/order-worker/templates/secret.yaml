# stringData, а не data: Kubernetes сам base64-кодирует значения при
# создании объекта — chart не занимается кодированием руками, и значения
# в values.yaml/`helm template` остаются читаемым текстом (что не делает
# их менее секретными — Secret в etcd всё равно НЕ шифрован без включённого
# encryption-at-rest, это ортогональная настройка кластера, а не чарта).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "order-worker.fullname" . }}-secret
  labels:
    {{- include "order-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

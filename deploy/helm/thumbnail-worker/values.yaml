# ─────────────────────────────────────────────────────────────────────────────
# thumbnail-worker — значения для deploy/kind, НЕ для прода (список внизу).
# Общий разбор probes/resources/ConfigMap-Secret — в
# deploy/helm/media/values.yaml. НЕТ ClusterIP Service (см.
# templates/deployment.yaml — работу раздаёт Kafka, а не kube-proxy) и НЕТ
# preStop (нет Service, который нужно защищать от гонки propagation).
# ─────────────────────────────────────────────────────────────────────────────

image:
  repository: gosplash/thumbnail-worker
  tag: dev
  pullPolicy: IfNotPresent

# Верхняя граница осмысленного масштабирования — число партиций топика
# media.photo.uploaded (см. tools kafka-init/topics): реплик БОЛЬШЕ, чем
# партиций, просто не получат ни одной партиции при ребалансировке и будут
# простаивать. maxReplicas ниже согласован с этим (см. deploy/kind).
replicaCount: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

ports:
  http: 8105
  metrics: 8203

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ── ИНАЧЕ, ЧЕМ У ВСЕХ ОСТАЛЬНЫХ: 80с, а не 50-65с ────────────────────────────
# cmd/thumbnail-worker/main.go на остановке зовёт waitFor() ТРИ РАЗА подряд
# (consumer, retry-consumer, outbox-relay), и КАЖДЫЙ вызов заводит СВОЙ
# независимый time.After(15s) — то есть, в отличие от catalog/analytics
# (waitAll с ОДНИМ общим deadline на несколько каналов), здесь бюджеты НЕ
# делятся, и по-настоящему плохой день может стоить 15+15+15=45с только на
# этом шаге. Итого: 2(sleep)+15(httpx.Shutdown)+45(три waitFor)+5(otel)=67с.
# Это не баг чарта — это то, как написан main.go (services/**, вне зоны
# этой задачи), и Helm обязан заложить РЕАЛЬНЫЙ худший случай, а не
# оптимистичную оценку "как у всех".
terminationGracePeriodSeconds: 80

resources:
  requests:
    cpu: 250m       # ресайз изображений CPU-bound, выше, чем у HTTP-сервисов
    memory: 256Mi   # декодированное изображение целиком в памяти на время ресайза
  limits:
    memory: 512Mi

# ── HPA: CPU — грубая, но не бессмысленная метрика для консьюмера ───────────
#
# ПРАВИЛЬНАЯ метрика для Kafka-консьюмера — лаг партиций (сообщений в
# очереди на партицию), а не CPU: сервис с полностью занятым CPU и НУЛЕВЫМ
# лагом (успевает обрабатывать всё по мере поступления) — это НЕ повод
# скейлиться, а лагающий консьюмер с низким CPU (например, ждёт медленный
# S3/Postgres, а не считает) — это ПОВОД скейлиться, который CPU-метрика
# просто не увидит. Alert на lag > 1000 уже заведён (docs/PLAN.md, фаза 6),
# но это алерт человеку, не триггер автоскейла.
#
# Здесь CPU НЕ совсем беспричинен, в отличие от order-worker: обработка
# ресайза (services/thumbnail-worker/internal/adapters/imagex,
# golang.org/x/image/draw) — это реально CPU-bound работа, и рост очереди
# ЧАСТО (хоть и не всегда) сопровождается ростом CPU просто потому, что
# воркер разгребает подряд идущие сообщения. Поэтому CPU — грубая, но не
# полностью бесполезная прокси-метрика ИМЕННО для этого сервиса, в отличие
# от order-worker (там нагрузка — это ожидание сети, а не счёт). Настоящее
# решение — KEDA ScaledObject на kafka consumer-group lag, вне объёма
# фазы 6.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

metrics:
  scrape: true
  path: /metrics

config:
  THUMBNAIL_HTTP_ADDR: ":8105"
  THUMBNAIL_METRICS_ADDR: ":8203"
  THUMBNAIL_SIZES: "320,800,1600"
  # Пусто = runtime.NumCPU() внутри процесса (см. pkg/config и main.go).
  THUMBNAIL_WORKERS: ""
  THUMBNAIL_LOCK_TTL: "30s"

  S3_ENDPOINT: "minio:9000"
  S3_USE_SSL: "false"
  S3_BUCKET_ORIGINALS: "gosplash-originals"
  S3_BUCKET_THUMBNAILS: "gosplash-thumbnails"

  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "20"
  REDIS_MAX_RETRIES: "3"
  REDIS_DIAL_TIMEOUT: "2s"
  REDIS_READ_TIMEOUT: "500ms"

  KAFKA_BROKERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP_THUMBNAIL: "thumbnail-worker"
  OUTBOX_POLL_INTERVAL: "1s"
  OUTBOX_BATCH_SIZE: "100"

  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  ENVIRONMENT: "kind"
  LOG_LEVEL: "info"

# НЕОЧЕВИДНОЕ РЕШЕНИЕ: thumbnail-worker использует ТЕ ЖЕ шарды Postgres,
# что и media (MEDIA_SHARD_*_DSN) — это одна и та же база (photos,
# processed_events, outbox), а не "похожая" (см. package doc
# services/thumbnail-worker/cmd/thumbnail-worker/main.go, разбор целиком).
# Поскольку чарты media и thumbnail-worker независимы, значения ниже
# ОБЯЗАНЫ дословно совпадать с deploy/helm/media/values.yaml
# secrets.MEDIA_SHARD_*_DSN — синхронизация РУЧНАЯ, чарт её не проверяет.
# В проде это решается ОДНИМ внешним секретом (Vault/External Secrets
# Operator), на который ссылаются оба чарта, а не копией значения в двух
# values.yaml.
secrets:
  MEDIA_SHARD_0_DSN: "host=pg-shard-0 port=5432 user=gosplash password=gosplash dbname=gosplash sslmode=disable"
  MEDIA_SHARD_1_DSN: "host=pg-shard-1 port=5432 user=gosplash password=gosplash dbname=gosplash sslmode=disable"
  S3_ACCESS_KEY: "gosplash"
  S3_SECRET_KEY: "gosplash"
  REDIS_PASSWORD: ""

# ─────────────────────────────────────────────────────────────────────────────
# ЧТО ОБЯЗАНО ПОМЕНЯТЬСЯ ДЛЯ ПРОДА — см. deploy/helm/media/values.yaml.
# Дополнительно: MEDIA_SHARD_*_DSN здесь и в media ОБЯЗАНЫ остаться
# идентичными при любом изменении — см. комментарий над secrets.
# ─────────────────────────────────────────────────────────────────────────────

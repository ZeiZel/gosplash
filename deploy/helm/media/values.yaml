# ─────────────────────────────────────────────────────────────────────────────
# media-service — значения по умолчанию рассчитаны на deploy/kind (учебный
# кластер на одной машине), НЕ на прод. Список того, что обязано поменяться
# для прода, — в конце файла и в отчёте по фазе 6 (docs/runbooks/kubernetes.md
# этого не описывает намеренно: runbook — про инциденты, а не про релиз-чеклист).
# ─────────────────────────────────────────────────────────────────────────────

image:
  repository: gosplash/media
  # "dev" — тег, который проставляет `make k8s-images` (mk/k8s.mk) при сборке
  # для kind: он один и тот же при каждой пересборке, поэтому тег НЕ является
  # доказательством того, какой код внутри — в kind это неважно (образ и так
  # грузится напрямую в узел, `kind load docker-image`, минуя реестр), а вот
  # в проде immutable-тег (git sha или semver) ОБЯЗАТЕЛЕН: иначе
  # `imagePullPolicy: IfNotPresent` начнёт молча оставлять старый бинарник
  # на части нод после раскатки.
  tag: dev
  # IfNotPresent, а не Always: в kind образа нигде, кроме локального
  # containerd-кеша ноды, не существует — реестра для него нет вообще,
  # и Always привёл бы к ImagePullBackOff на ровном месте. В проде с
  # настоящим реестром и immutable-тегами это тоже безопасно (тег не
  # переиспользуется), но там разумнее Always — на случай, если кто-то
  # всё же передеплоил тот же тег.
  pullPolicy: IfNotPresent

# 2 реплики по умолчанию — минимум, при котором вообще имеет смысл headless
# Service из ADR 0015 (на одной реплике round_robin выбирать не из чего) и при
# котором раскатка новой версии не роняет сервис до нуля на время недоступности
# одного пода.
replicaCount: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Безопасность пода ────────────────────────────────────────────────────────
# Требование задания «непривилегированный пользователь, никакого root»
# продублировано здесь НАМЕРЕННО, хотя базовый образ (distroless:nonroot,
# см. deploy/docker/media.Dockerfile) уже запускается от nonroot: если кто-то
# в будущем поменяет базовый образ на обычный distroless (без :nonroot) или
# на alpine, чарт всё равно не даст поду стартовать от root — runAsNonRoot
# без явного runAsUser в контейнере привёл бы к ошибке запуска, а не к тихому
# откату на root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Порты процесса — см. pkg/config/config.go (MediaConfig) и .env.example.
# Меняются здесь и в values.config.MEDIA_*_ADDR СИНХРОННО: чарт не читает
# один источник дважды, потому что порт — это одновременно "куда слушать
# внутри контейнера" (env) и "какой containerPort объявить Kubernetes'у"
# (Deployment/probes/Service), а это два разных места в манифестах.
ports:
  http: 8101
  grpc: 9101
  metrics: 8201

# ── Пробы: liveness ≠ readiness ──────────────────────────────────────────────
#
# ПОЧЕМУ РАЗНЫЕ: /healthz (liveness) в pkg/httpx.Health отвечает ok, если
# процесс вообще способен ответить на HTTP-запрос — и ничего не проверяет
# за пределами процесса (см. package doc pkg/httpx/health.go). /readyz
# (readiness) проверяет postgres — единственную внешнюю зависимость media,
# от которой зависит приём загрузок (kafka и redis у media сознательно НЕ
# входят в readiness, см. комментарий "Готовность" в cmd/media/main.go).
#
# ПОЧЕМУ В LIVENESS НЕЛЬЗЯ ПРОВЕРЯТЬ БАЗУ: liveness = "Kubernetes должен
# ПЕРЕЗАПУСТИТЬ под, если провал". Если бы сюда попал postgres.Ping, короткая
# заминка базы (GC-пауза, failover реплики, сетевой затор) провалила бы
# liveness ОДНОВРЕМЕННО на всех репликах media — kubelet перезапустил бы их
# все разом, они бы одновременно полезли переоткрывать пул соединений к базе,
# которая только что восстановилась, и добили бы её этим повторным всплеском
# ровно в момент, когда она слабее всего. Раздельные пробы существуют именно
# для того, чтобы "не могу сейчас принять трафик" (readiness, под просто
# убирают из балансировки, ничего не перезапускают) не превращалось в
# "нужно убить процесс" (liveness).
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    # 3s, не 2s: pkg/httpx.Health.Handle сам ограничивает СУММУ всех проверок
    # 2-секундным бюджетом (context.WithTimeout в health.go). timeoutSeconds
    # пробы должен быть СТРОГО БОЛЬШЕ внутреннего бюджета, иначе kubelet
    # оборвёт соединение раньше, чем обработчик успеет честно ответить
    # 503 с деталями, — и в логах будет "probe timeout" вместо настоящей
    # причины (какая именно проверка провалилась).
    timeoutSeconds: 3
    failureThreshold: 3

# ── Пауза перед остановкой и terminationGracePeriodSeconds ──────────────────
#
# pkg/httpx.Shutdown и main.go сервиса на SIGTERM делают:
#   1. health.NotReady() + grpcHealth.NotServing()      — мгновенно;
#   2. time.Sleep(2s)                                    — до 2с;
#   3. httpx.Shutdown (http+metrics), таймаут            — до 15с;
#   4. grpcx.Shutdown (gRPC), отдельный таймаут          — до 15с;
#   5. ожидание outbox-relay (см. cmd/media/main.go)      — до 15с;
#   6. otel shutdown                                      — до 5с.
# Итого ХУДШИЙ случай — 2+15+15+15+5 = 52 секунды ВНУТРИ процесса, если
# каждый шаг реально упирается в свой таймаут (медленный клиент держит
# соединение, relay застрял на большом батче и т.д.).
#
# К этому добавляется preStop (ниже) — ещё 5с ДО того, как SIGTERM вообще
# дойдёт до процесса. Итого worst-case ~57с. terminationGracePeriodSeconds
# по умолчанию в Kubernetes — 30с, что МЕНЬШЕ этого числа: если бы чарт его
# не переопределил, kubelet прислал бы SIGKILL ПОСРЕДИ штатного шатдауна,
# оборвав недоставленные события outbox и активные запросы — то есть ровно
# то, что весь этот механизм должен был предотвратить. Берём с запасом.
terminationGracePeriodSeconds: 65

# ── preStop: зачем нужен, если процесс и так слушает SIGTERM ────────────────
#
# NotReady() внутри процесса и удаление пода из Service — RAZNYE события,
# которые Kubernetes НЕ гарантирует упорядочивать. При терминации пода
# kubelet одновременно (а) начинает убирать под из EndpointSlice сервиса
# и (б) запускает preStop-хук/шлёт SIGTERM. Изменение EndpointSlice ещё
# должно долететь до kube-proxy на КАЖДОЙ ноде и перезаписать iptables/ipvs —
# это не мгновенно. Если SIGTERM (и значит, sleep(2s) внутри процесса,
# и тем более закрытие слушателя) происходит РАНЬШЕ, чем это распространение
# завершилось, часть новых запросов, отправленных другими подами ДО того,
# как они узнали об изменении, попадёт в под, который уже отказывается
# их принимать, — connection refused/reset вместо тихого ухода.
#
# preStop с задержкой решает именно это: он выполняется ДО отправки SIGTERM,
# то есть под продолжает ПОЛНОЦЕННО обслуживать трафик все эти секунды,
# пока распространение удаления из Endpoints завершается на всех узлах.
# Через preStopSleepSeconds ПОСЛЕ этого запускается SIGTERM и уже
# ВНУТРЕННИЙ sleep(2s) процесса — это другая пауза, для другой проблемы
# (readinessProbe должен успеть провалиться и это должно быть замечено,
# что медленнее, чем просто "endpoint убран из списка").
#
# Экшен sleep (lifecycle.preStop.sleep.seconds), а не exec ["sleep","5"]:
# итоговый образ — gcr.io/distroless/static-debian12 (см. media.Dockerfile),
# в нём НЕТ ни шелла, ни бинарника /bin/sleep, exec-хук просто не найдёт,
# что запускать. Нативный sleep-экшен (KEP-3960, GA с Kubernetes 1.29) не
# требует ничего внутри контейнера — именно поэтому выбор distroless вместо
# alpine не мешает preStop-паузе. Кластер kind, который тянет `make kind-up`,
# современный и этот экшен поддерживает; для более старого кластера
# (< 1.29 без feature gate) пришлось бы либо включать feature gate, либо
# менять базовый образ на что-то с /bin/sleep — это явный компромисс distroless.
preStop:
  enabled: true
  sleepSeconds: 5

# ── Ресурсы: почему limits.cpu не задан, а limits.memory обязателен ──────────
#
# ПАМЯТЬ: превысил limit — OOMKilled, под перезапускается ЧИСТО (новый
# процесс с нуля, никаких промежуточных состояний). Без limit один под
# с утечкой (например, разбухший буфер relay при огромном батче) может
# съесть память НОДЫ целиком и уронить ВСЕ поды на ней, включая чужие, —
# это худший вид отказа: не изолированный, а заразный.
#
# CPU: превысил limit — под НЕ убивают, его троттлят (CFS quota throttling):
# планировщик ядра просто не даёт процессу выполняться дальше в пределах
# текущего периода, даже когда на ноде есть свободные ядра простаивающих
# соседей. Для http-сервиса под нагрузкой это означает рост latency без
# единой ошибки в логах — troubleshooting превращается в "почему p99 растёт,
# ведь CPU node не занята на 100%". Поэтому limits.cpu сознательно не
# выставлен: requests.cpu резервирует место в шедулинге (кворум ресурсов
# на ноде), а throttling сверху ничем не помогает и только маскирует момент,
# когда пора горизонтально скейлиться (см. autoscaling ниже) под "необъяснимую
# деградацию". Жертвуем noisy-neighbor-изоляцией по CPU ради предсказуемой
# latency отдельного пода — приемлемо для этого кластера, где сервисов
# немного и они не соревнуются за CPU агрессивно.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# HPA по CPU. media — не Kafka-консьюмер (outbox-relay — фоновый поток внутри
# процесса, но не consumer group), поэтому CPU — адекватная прокси-метрика
# нагрузки: рост входящих загрузок напрямую поднимает CPU (декодирование
# multipart, запись в S3/Postgres).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Какие Service заводить. media — единственный из "полных" сервисов, у
# которого ОБА порта публично значимы: HTTP — обычный ClusterIP (сюда
# проксирует NGINX/Ingress), gRPC — headless (сюда ходит catalog, docs/adr/0015).
service:
  http:
    type: ClusterIP

metrics:
  # Аннотации prometheus.io/* на поде, а не ServiceMonitor: в проекте нет
  # prometheus-operator (см. deploy/observability/prometheus.yaml — обычный
  # Prometheus со статическим/аннотационным discovery), заводить CRD ради
  # одного чарта было бы лишней зависимостью не по адресу этой задачи.
  scrape: true
  path: /metrics

# ── ConfigMap (config) и Secret (secrets) ────────────────────────────────────
#
# ПРАВИЛО РАЗДЕЛЕНИЯ: DSN с паролем, ключи S3 и JWT_SECRET — в Secret;
# всё остальное (адреса без пароля, тайминги, размеры батчей, фичефлаги
# в виде чисел) — в ConfigMap. Критерий не "это про инфраструктуру" (тогда
# и REDIS_ADDR попал бы в Secret просто потому, что это адрес базы), а
# "утечка этого значения в `kubectl describe configmap` или git diff даёт
# атакующему шаг к деньгам/данным чужого пользователя". Адрес Kafka без
# аутентификации бесполезен без доступа В СЕТЬ, где он и так виден (это тот
# же кластер); пароль в DSN работает С ЛЮБОЙ точки, откуда есть сетевой
# доступ до Postgres, — то есть база и внешняя exfiltration через один
# скопированный пароль опаснее на порядок, чем факт "база слушает вот тут".
config:
  MEDIA_HTTP_ADDR: ":8101"
  MEDIA_GRPC_ADDR: ":9101"
  MEDIA_METRICS_ADDR: ":8201"

  # minio — имя Service инфраструктурного чарта/манифеста из deploy/kind
  # (см. deploy/kind/infra/minio.yaml). Порт 9000 — S3 API MinIO ВНУТРИ
  # кластера, не путать с 59000 из .env.example — тот проброшен на хост.
  S3_ENDPOINT: "minio:9000"
  S3_USE_SSL: "false"
  S3_BUCKET_ORIGINALS: "gosplash-originals"
  S3_BUCKET_THUMBNAILS: "gosplash-thumbnails"
  S3_PRESIGNED_TTL: "15m"

  # KAFKA_BROKERS обязателен ИМЕННО здесь, хотя media не читает ни одного
  # топика: у него работает outbox-relay, а relay публикует в Kafka.
  # Без этой строки pkg/config подставляет localhost:59094 (значение для
  # запуска с хоста), relay упирается в context deadline exceeded, и
  # события навсегда остаются в очереди. Показательно, что данные при этом
  # НЕ теряются — в этом и смысл outbox, — но каталог отстаёт от реальности
  # молча, и заметить это можно только по метрике outbox_pending.
  KAFKA_BROKERS: "kafka:9092"

  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "20"
  REDIS_MAX_RETRIES: "3"
  REDIS_DIAL_TIMEOUT: "2s"
  REDIS_READ_TIMEOUT: "500ms"

  GRPC_DEFAULT_TIMEOUT: "5s"

  # Token bucket загрузок — см. .env.example, те же значения по умолчанию.
  MEDIA_UPLOAD_RATE_CAPACITY: "10"
  MEDIA_UPLOAD_RATE_REFILL_PER_SEC: "0.5"

  # otel-collector — Service из deploy/kind/infra/observability.yaml.
  # Пусто было бы тоже валидно (см. pkg/config: пустой OTLPEndpoint значит
  # "трейсы никуда не уезжают, но сервис работает") — в kind коллектор
  # поднят, поэтому указываем его.
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  ENVIRONMENT: "kind"
  LOG_LEVEL: "info"

# НЕОЧЕВИДНОЕ РЕШЕНИЕ: значения ниже — учебные пароли "gosplash"/пусто,
# ТЕ ЖЕ, что в .env.example для локального docker-compose. Это осознанный
# выбор ради воспроизводимости демо-кластера одной командой (`make kind-up`)
# без отдельного шага "сгенерируй и сохрани секреты", а не забытая заглушка —
# см. итоговый список "что менять для прода" в конце файла.
secrets:
  # pg-shard-0/pg-shard-1 — Service'ы из deploy/kind/infra/postgres.yaml.
  MEDIA_SHARD_0_DSN: "host=pg-shard-0 port=5432 user=gosplash password=gosplash dbname=gosplash sslmode=disable"
  MEDIA_SHARD_1_DSN: "host=pg-shard-1 port=5432 user=gosplash password=gosplash dbname=gosplash sslmode=disable"
  S3_ACCESS_KEY: "gosplash"
  S3_SECRET_KEY: "gosplash"
  # Пусто — аутентификация gRPC выключена. main.go печатает про это warning
  # при старте (см. .env.example и pkg/config), в kind-демо это допустимо.
  JWT_SECRET: ""
  REDIS_PASSWORD: ""

# ─────────────────────────────────────────────────────────────────────────────
# ЧТО ОБЯЗАНО ПОМЕНЯТЬСЯ ДЛЯ ПРОДА (см. также отчёт по фазе 6):
#   - image.tag: immutable (git sha/semver), image.pullPolicy: Always;
#   - secrets.*: реальные пароли/ключи, заведённые через внешний секрет-
#     менеджер (Vault/External Secrets Operator), а не в values.yaml —
#     в этом файле они лежат открытым текстом ТОЛЬКО ради воспроизводимости
#     kind-демо одной командой;
#   - config.JWT_SECRET фактически в secrets — установить непустым;
#   - resources.requests/limits — снять с "разумных дефолтов для ноутбука"
#     и посчитать по реальному профилю нагрузки (см. docs/perf после
#     нагрузочных сценариев k6, вне зоны этой задачи);
#   - autoscaling.maxReplicas — поднять и завести PodDisruptionBudget
#     (в объём этой задачи не входил, чарт его не создаёт);
#   - replicaCount/minReplicas — пересмотреть с учётом реальной SLA.
# ─────────────────────────────────────────────────────────────────────────────

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "media.serviceAccountName" . }}
  labels:
    {{- include "media.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken: false — media не ходит в Kubernetes API
# (в отличие от, скажем, оператора или sidecar-инжектора), поэтому токен
# API-сервера ему не нужен вообще, а его наличие в файловой системе пода —
# лишняя цель для эксфильтрации при компрометации процесса.
automountServiceAccountToken: false
{{- end }}

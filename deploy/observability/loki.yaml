# Loki в однопроцессном режиме.
#
# Ключевая идея Loki: он индексирует ТОЛЬКО метки (service, container),
# а само содержимое строк не индексирует вовсе — оно просто лежит сжатым.
# Отсюда два практических следствия:
#   1. Loki дёшев по сравнению с Elasticsearch;
#   2. запрос обязан сначала сузиться по меткам, а уже потом искать текст.
#      Поиск по всем логам сразу будет медленным, и это не настройка, а дизайн.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  # Логи с хоста могут приезжать со сдвигом часов — не отбрасываем их молча.
  reject_old_samples: false

# ─────────────────────────────────────────────────────────────────────────────
# NGINX как точка входа gosplash. Слушает :8080, раскидывает по префиксу.
#
# Снаружи всегда HTTP/JSON. Внутри сервисы говорят на gRPC, а HTTP/JSON-фасад
# им делает grpc-gateway, сгенерированный из тех же .proto. Значит, NGINX
# проксирует на HTTP-порт сервиса и про gRPC ничего не знает.
# Исключение — загрузка файла: это чистый multipart-хендлер в media.
#
# Пока сервисы не написаны, любой маршрут вернёт 502 — это нормально,
# NGINX поднимается независимо. Проверить, что он жив: GET /healthz.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Логи в stdout/stderr — их видно в `docker compose logs gateway`.
    # upstream_addr показывает, в какую именно реплику ушёл запрос:
    # именно по этому полю ты увидишь балансировку, когда запустишь
    # несколько экземпляров catalog.
    log_format  main  '$remote_addr $status $request_time "$request" -> $upstream_addr';
    access_log  /dev/stdout main;
    error_log   /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # ── Upstream'ы ───────────────────────────────────────────────────────────
    # Сервисы запускаются на хосте через `go run`, поэтому адрес —
    # host.docker.internal. Когда сервисы переедут в контейнеры, здесь
    # достаточно заменить хост на имя compose-сервиса (media:8101), и
    # NGINX начнёт балансировать между всеми репликами через Docker DNS.
    #
    # resolver нужен, чтобы NGINX перечитывал DNS: без него он резолвит имя
    # один раз при старте и продолжает стучаться в умерший контейнер.
    upstream media    { server host.docker.internal:8101; keepalive 16; }
    upstream catalog  { server host.docker.internal:8102; keepalive 16; }
    upstream wallet   { server host.docker.internal:8103; keepalive 16; }
    upstream order    { server host.docker.internal:8104; keepalive 16; }

    # ── Rate limiting на входе ───────────────────────────────────────────────
    # Первый рубеж защиты: 20 запросов в секунду с адреса, всплеск до 40.
    # Это грубый лимит «на весь API». Бизнес-лимит («не больше 10 загрузок
    # в час на пользователя») живёт в Redis внутри сервиса — NGINX не знает,
    # кто такой пользователь.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Пробрасываем заголовки трассировки, чтобы трейс не рвался на входе.
    # Их выставляет клиент или сам NGINX-модуль otel; здесь просто не теряем.
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate  $http_tracestate;

    server {
        listen 8080;

        # Проверка живости самого NGINX — не ходит ни в один сервис.
        location = /healthz {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","component":"gateway"}';
        }

        # ── Загрузка файла ───────────────────────────────────────────────────
        # Отдельный location до общего /media/, потому что у него другие
        # настройки: большой лимит тела и длинные таймауты. Оригинал в 50 МБ
        # не должен упереться в дефолтный client_max_body_size 1m.
        #
        # proxy_request_buffering off — NGINX стримит тело в сервис по мере
        # получения, а не копит целиком на диске. Для загрузок это заметно
        # экономит память и время до первого байта.
        location = /media/upload {
            limit_req zone=api burst=10 nodelay;

            client_max_body_size     50m;
            proxy_request_buffering  off;
            proxy_read_timeout       300s;
            proxy_send_timeout       300s;

            proxy_pass http://media;
        }

        # ── Проверки состояния сервисов ──────────────────────────────────────
        # Сервис отдаёт /healthz и /readyz в корне своего роутера, а снаружи
        # они должны различаться по сервисам. proxy_pass С УКАЗАННЫМ ПУТЁМ
        # заменяет совпавшую часть location: /media/readyz → /readyz.
        # Это работает только для точных и префиксных location, не для regex —
        # частая причина «почему у меня 404 на бэкенде».
        location = /media/healthz   { proxy_pass http://media/healthz; }
        location = /media/readyz    { proxy_pass http://media/readyz; }
        location = /catalog/healthz { proxy_pass http://catalog/healthz; }
        location = /catalog/readyz  { proxy_pass http://catalog/readyz; }

        location /media/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://media;
        }

        location /catalog/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://catalog;
        }

        location /wallet/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://wallet;
        }

        location /orders/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://order;
        }

        location = / {
            add_header Content-Type application/json;
            return 200 '{"service":"gosplash gateway","routes":["/media/","/catalog/","/wallet/","/orders/"]}';
        }
    }
}

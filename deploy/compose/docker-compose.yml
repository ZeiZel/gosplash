# ─────────────────────────────────────────────────────────────────────────────
# Корневой compose-файл проекта gosplash.
#
# Сам он ничего не описывает — только подключает соседние файлы стеков.
# Так удобнее: можно поднять весь мир (`make up`) или только то, что нужно
# сегодня (`make up-pg`, `make up-kafka`), а каждый файл остаётся коротким
# и с комментариями по своей теме.
#
# Директива include появилась в Docker Compose 2.20. Относительные пути
# внутри включённого файла резолвятся от его собственной директории,
# поэтому ../nginx/... в gateway.yml указывает туда, куда надо.
#
# Все контейнеры оказываются в одной сети проекта (gosplash_default) и видят
# друг друга по имени сервиса: kafka:9092, redis:6379, minio:9000.
# С хоста — только через проброшенные порты, они разные (см. таблицу в README).
# ─────────────────────────────────────────────────────────────────────────────

name: gosplash

include:
  - postgres.yml       # pg-shard-0/1, pg-catalog (+реплика), pg-wallet, pg-order
  - kafka.yml          # kafka (KRaft), kafka-init, kafka-ui
  - redis.yml          # redis, redisinsight
  - minio.yml          # minio, minio-init
  - temporal.yml       # pg-temporal, temporal, temporal-ui
  - clickhouse.yml     # clickhouse                          (фаза 4)
  - elasticsearch.yml  # elasticsearch                       (фаза 5)
  - observability.yml  # otel-collector, tempo, loki, promtail, prometheus, grafana
  - gateway.yml        # nginx

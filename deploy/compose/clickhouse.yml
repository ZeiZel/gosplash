# ─────────────────────────────────────────────────────────────────────────────
# CLICKHOUSE — аналитическое хранилище (фаза 4).
#
# Зачем отдельная база, если есть PostgreSQL: у них противоположные сильные
# стороны. PostgreSQL строковый — читает строку целиком, быстро находит одну
# по индексу, умеет UPDATE и транзакции. ClickHouse колоночный — читает только
# нужные колонки и только нужные засечки, поэтому «посчитай сумму по миллиарду
# строк» для него обычная работа, а «отдай одну строку по id» — нет.
#
# Правило: OLTP (заказы, счета, метаданные) — PostgreSQL; OLAP (просмотры,
# агрегаты, отчёты) — ClickHouse. Смешивать их в одной базе можно ровно до
# того момента, когда отчёт начинает мешать оформлению заказа.
# ─────────────────────────────────────────────────────────────────────────────

services:

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: gosplash
      CLICKHOUSE_PASSWORD: gosplash
      CLICKHOUSE_DB: gosplash
      # Без этого пользователь не сможет создавать таблицы и матвьюхи.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "58123:8123"   # HTTP — сюда ходит clickhouse-go и curl
      - "59440:9000"   # native TCP — быстрее, им пользуется драйвер по умолчанию
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      # ClickHouse держит много файловых дескрипторов: каждая засечка каждой
      # колонки каждой партиции — это файлы. Дефолт контейнера ему мал.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  clickhouse-data:

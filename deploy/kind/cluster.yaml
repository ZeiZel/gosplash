# ─────────────────────────────────────────────────────────────────────────────
# kind-кластер для gosplash (фаза 6, docs/PLAN.md). Поднимается `make kind-up`
# (mk/k8s.mk), сносится `make kind-down`. Это ОДНОРАЗОВЫЙ учебный кластер:
# без персистентных дисков за пределами emptyDir (см. deploy/kind/infra/*) —
# `kind delete cluster` уносит с собой все данные, и это ожидаемо.
#
# ── ПОЧЕМУ 1 control-plane + 2 worker'а, А НЕ ОДИН УЗЕЛ ─────────────────────
# Однoузловой kind (control-plane совмещённый с worker) технически проще,
# но прячет ровно то, ради чего в задании есть headless Service (ADR 0015):
# на одном узле round_robin между репликами одного Deployment визуально
# неотличим от случая, когда kube-proxy просто попал в единственный
# возможный под, — с одним узлом легко перепутать "балансировка работает"
# и "деться было некуда". Два worker'а дают Kubernetes хотя бы теоретическую
# возможность растащить реплики media/catalog/wallet по разным узлам, и
# именно тогда становится видно, что round_robin действительно уходит
# на разные IP, а не совпадение внутри одного network namespace узла.
#
# ── extraPortMappings ────────────────────────────────────────────────────────
# 30080→8080 зарезервирован под NodePort, если понадобится достучаться до
# гейтвея/сервиса снаружи узла без port-forward (например, ручной curl во
# время разбора инцидента по runbook'у). Ingress-контроллер в объём этой
# задачи не входит (deploy/nginx — не моя зона, см. ограничения задания) —
# использовать этот порт можно, ЗАВЕДЯ Service типа NodePort=30080 руками
# поверх любого чарта, когда это понадобится; по умолчанию его никто не
# слушает, и это нормально.
# ─────────────────────────────────────────────────────────────────────────────
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gosplash
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
